services:
  nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: voice-agent-proxy
    restart: unless-stopped
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - proxy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  postgres:
    image: postgres:15-alpine
    container_name: voice-agent-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-voice_agents}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - db-network
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voice-agent-backend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SOFTNIX_API_KEY=${SOFTNIX_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-voice_agents}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - UV_CACHE_DIR=/tmp/uv_cache
    volumes:
      - ./server/data:/app/data:rw
      - ./Softnix.png:/app/Softnix.png:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy-network
      - db-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
        NEXT_PUBLIC_WEBSOCKET_ENDPOINT: ${NEXT_PUBLIC_WEBSOCKET_ENDPOINT:-wss://localhost/ws}
    container_name: voice-agent-frontend
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /dev/shm:rw,noexec,nosuid,nodev,size=64m
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://localhost}
      - NEXT_PUBLIC_WEBSOCKET_ENDPOINT=${NEXT_PUBLIC_WEBSOCKET_ENDPOINT:-wss://localhost/ws}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: [ "CMD", "node", "-e", "const req = require('http').get('http://localhost:3000/admin', (r) => process.exit((r.statusCode || 500) < 400 ? 0 : 1)); req.on('error', () => process.exit(1));" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  proxy-network:
    driver: bridge
  db-network:
    driver: bridge
    internal: true

volumes:
  postgres_data:
    driver: local
