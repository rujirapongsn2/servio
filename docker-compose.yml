services:
  nginx:
    image: nginx:alpine
    container_name: voice-agent-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - voice-agent-network

  postgres:
    image: postgres:15-alpine
    container_name: voice-agent-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-voice_agents}
    # ports removed for security
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - voice-agent-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voice-agent-backend
    restart: unless-stopped
    # ports removed for security (accessible via nginx)
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SOFTNIX_API_KEY=${SOFTNIX_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - DATABASE_PATH=/app/data/agents.db
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/voice_agents}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
      - UV_CACHE_DIR=/tmp/uv_cache
    volumes:
      # Database persistence
      - ./server/data:/app/data:rw
      # Static assets (Softnix.png at repo root)
      - ./Softnix.png:/app/Softnix.png:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - voice-agent-network
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/admin/sessions')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voice-agent-frontend
    restart: unless-stopped
    # ports removed for security (accessible via nginx)
    environment:
      - NEXT_PUBLIC_WEBSOCKET_ENDPOINT=${NEXT_PUBLIC_WEBSOCKET_ENDPOINT:-ws://localhost/ws}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - voice-agent-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  voice-agent-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
