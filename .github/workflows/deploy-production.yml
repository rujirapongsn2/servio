name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: Start with verify-ssh, then dry-run before enabling deploy
        type: choice
        options: [verify-ssh, dry-run, deploy, rollback]
        default: verify-ssh
      rollback_sha:
        description: Currently deployed release SHA, required for rollback
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: servio-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'rujirapongsn2/servio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DATABASE_URL: sqlite:////tmp/servio-ci-unused.sqlite
      PYTHONPATH: server
      OPENAI_API_KEY: fake-ci-key
      JWT_SECRET_KEY: fake-ci-jwt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.11.15'
          enable-cache: true
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          uv sync --project server --frozen --python 3.11
          uv pip install --python server/.venv/bin/python pytest==8.4.2
          npm ci --prefix frontend
      - name: Backend regression with isolated DB and fake services
        run: |
          server/.venv/bin/python -m pytest -q \
            server/tests/test_deploy_production.py server/tests/test_docker_deployment.py server/tests/test_host_startup.py \
            server/tests/test_private_channel_parity.py server/tests/test_workflow_preview.py \
            server/tests/test_workflow_creation.py server/tests/test_team_workflow.py \
            server/tests/test_workflow_membership.py server/tests/test_knowledge_runtime_scope.py \
            server/tests/test_mcp_product_presentations.py server/tests/test_custom_api.py \
            server/tests/test_a2ui_discovery.py server/tests/test_video_attachments.py
      - name: Frontend regression
        working-directory: frontend
        run: node --test --test-concurrency=1 tests/*.test.mjs
      - name: TypeScript
        working-directory: frontend
        run: npx tsc --noEmit

  build:
    needs: validate
    if: >-
      github.repository == 'rujirapongsn2/servio' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'push' && vars.PROD_AUTO_DEPLOY == 'true') ||
       (github.event_name == 'workflow_dispatch' && (inputs.mode == 'dry-run' || inputs.mode == 'deploy')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Publish immutable Linux images
        id: images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          python3 scripts/deploy/build_images.py

  deploy:
    needs: [validate, build]
    if: >-
      always() && !cancelled() && needs.validate.result == 'success' &&
      github.repository == 'rujirapongsn2/servio' && github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
        ((inputs.mode == 'verify-ssh' || inputs.mode == 'rollback') || needs.build.result == 'success')) ||
       (github.event_name == 'push' && vars.PROD_AUTO_DEPLOY == 'true' && needs.build.result == 'success'))
    environment:
      name: production
      url: https://servio.softnix.ai
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Restricted SSH deployment
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_HOST: ${{ vars.PROD_SSH_HOST }}
          PROD_SSH_PORT: ${{ vars.PROD_SSH_PORT }}
          PROD_SSH_USER: ${{ vars.PROD_SSH_USER }}
          PROD_SSH_KNOWN_HOSTS: ${{ vars.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_HOST_KEY_SHA256: ${{ vars.PROD_SSH_HOST_KEY_SHA256 }}
          PROD_HOST_ID: ${{ vars.PROD_HOST_ID }}
          PROD_IMAGES: ${{ needs.build.outputs.images }}
          DEPLOY_MODE: ${{ github.event_name == 'push' && 'deploy' || inputs.mode }}
          RELEASE_SHA: ${{ inputs.mode == 'rollback' && inputs.rollback_sha || github.sha }}
        run: |
          python3 scripts/deploy/ssh_client.py --mode "$DEPLOY_MODE" --sha "$RELEASE_SHA" > "$RUNNER_TEMP/deploy-result.json"
          cat "$RUNNER_TEMP/deploy-result.json" >> "$GITHUB_STEP_SUMMARY"
