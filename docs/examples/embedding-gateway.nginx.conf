# Include in nginx's http context (for example /etc/nginx/conf.d/servio-embedding.conf).
# A 64-character key plus the Bearer prefix exceeds the default map bucket.
map_hash_bucket_size 128;
map $http_authorization $embedding_authorized {
    default 0;
    include /etc/nginx/servio-embedding-keys.map;
}

server {
    listen 443 ssl;
    server_name embedding.internal.example;
    ssl_certificate /etc/nginx/tls/embedding/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/embedding/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Replace with Host A's actual egress address as observed by Host B.
    allow 10.20.0.10;
    deny all;
    if ($embedding_authorized = 0) { return 401; }

    client_max_body_size 32m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 200s;
    proxy_read_timeout 200s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    # Authentication happens here; the loopback inference process is anonymous.
    proxy_set_header Authorization "";
    # No access logs containing inputs or credentials.
    access_log off;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
    }
    location = /props {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8090;
    }
    location = /v1/embeddings {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8090;
    }
    location / { return 404; }
}
